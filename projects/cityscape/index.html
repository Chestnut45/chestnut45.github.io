<h2 id="cityscape"><a href="https://github.com/Chestnut45/cityscape">Cityscape</a></h2>

<p>A procedurally generated infinite cityscape with a deferred renderer, shadow mapping, a dynamic day-night cycle, and snow accumulation. Built with an early version of the Phi micro-engine for the final assignment of the computer graphics programming course at UPEI.</p>
